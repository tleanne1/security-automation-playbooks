name: Security Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  universal-alert-triage:
    name: Universal Alert Triage Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playbooks/universal-alert-triage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: playbooks/universal-alert-triage/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run security workflow tests
        run: python -m pytest tests/ -v
